name: ✅ CI

on:
  pull_request:
  push:
    # `main` is already covered by the release and CodeQL workflows.
    branches-ignore: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧹 Lint
        run: npm run lint:ci

      - name: 🔎 Type-check
        run: npm run typecheck

      - name: 🧪 Test
        run: npm test

      - name: 🔨 Build
        run: npm run build
