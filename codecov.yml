# Codecov configuration
# Coverage is generated by `jest --coverage` (lcov) in the CodeQL workflow.
coverage:
  precision: 2
  round: down
  range: '70...100'
  status:
    project:
      default:
        target: auto
        threshold: 2%
        informational: true
    patch:
      default:
        informational: true

# Only measure library source; tests, examples and build output are noise.
ignore:
  - 'test'
  - 'example'
  - 'lib'
  - '**/*.spec.ts'
  - '**/*.spec.tsx'

comment: false
